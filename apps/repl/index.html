<!doctype html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <title>Limber » Playground and REPL</title>
    <meta
      name="description"
      content="Limber is a playground and REPL for various web technologies, such as Svelte, Vue, Mermaid, Ember, React, and more. It also demonstrates how documentation can have live islands of different frameworks rendering all from the same document"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      This the source of truth for the ember brand variables
        https://emberjs.com/images/brand/Ember-Brand-Guidelines.pdf
    -->
    <style type="text/css">
      :root {
        --ember-brand: #e04e39;
        --ember-black: #212121;
        --ember-burnt-ember: #9b2918;
        --ember-gray: #817f7f;
        --ember-blue: #1e719b;
        --ember-faint-gray: #efebea;
        --ember-light-blue: #74b0ce;
        --ember-linen: #fdf7f6;
        --ember-yellow: #fbc840;
        --ember-white: #fdfdfd;
      }
    </style>
    <script>
      globalThis.v8 = {};
      globalThis.path = {
        resolve: (...args) => args.join("/"),
      };
    </script>
    <!--
      The editor placeholder uses this font on the first render.
      Without the preload, the browser finds the font only after it parses the CSS.
      Keep the URL in sync with the @font-face rule in app/styles/app.css.
    -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      crossorigin
      href="https://fonts.gstatic.com/s/sourcecodepro/v30/HI_diYsKILxRpg3hIP6sJ7fM7PqPMcMnZFqUwX28DMyQtMlrTA.woff2"
    />
    <link rel="stylesheet" href="./app/styles/app.css" />
    <!-- VITE_EMBER_SSR_HEAD -->
  </head>
  <body class="syntax-dark syntax-bright">
    <script>
      /**
       * Before the first paint, so that a dark page does not flash white.
       *
       * ember-primitives/color-scheme reads the same key when the app boots.
       */
      {
        const key = "ember-primitives/color-scheme#local-preference";
        const isDark = matchMedia("(prefers-color-scheme: dark)").matches;
        const scheme = localStorage.getItem(key) ?? (isDark ? "dark" : "light");

        document.documentElement.style.colorScheme = scheme;
        document.body.classList.add(`theme-${scheme}`);
      }
    </script>
    <div id="initial-loader">
      <style>
        body,
        html {
          margin: 0;
          padding: 0;
        }

        #initial-shell {
          height: 100vh;
          width: 100vw;
          display: grid;
          grid-template-rows: min-content 1fr;
        }
        #initial-header {
          background: var(--ember-black);
          height: 45px;
          width: 100%;
        }
        #initial-panes {
          display: grid;
          grid-template-columns: auto 1fr;
          font-weight: bold;
          font-size: 24px;
        }
        #initial-editor {
          width: 40vw;
          background: rgba(39, 39, 42);
          color: white;
          padding-right: 2px;
          display: grid;
          align-items: center;
          justify-content: end;
        }
        #initial-preview {
          padding-left: 2px;
          color: light-dark(rgb(39, 39, 42), white);
          display: grid;
          align-items: center;
          justify-content: start;
        }

        /*
          The edit page frames the output page.
          The frame has no header and no editor, so it shows one centered message.
        */
        .in-frame #initial-header,
        .in-frame #initial-editor {
          display: none;
        }
        .in-frame #initial-shell,
        .in-frame #initial-panes {
          grid-template-rows: 1fr;
          grid-template-columns: 1fr;
        }
        .in-frame #initial-preview {
          padding: 0;
          justify-content: center;
          font-weight: normal;
          font-size: 16px;
          opacity: 0.6;
        }
      </style>
      <!--
        This is the App Shell
        It's sole purpose is to show something when the HTML loads (which is small and loads / is parsed fast)
        This gives the user an illusion of speed
      -->
      <div id="initial-shell">
        <!-- header -->
        <div id="initial-header"></div>

        <!-- everything else -->
        <div id="initial-panes">
          <!-- editor -->
          <div id="initial-editor">Loading</div>

          <!-- preview -->
          <div id="initial-preview">Limber</div>
        </div>
      </div>
    </div>

    <script>
      if (window.self !== window.parent) {
        document.documentElement.classList.add("in-frame");
        document.querySelector("#initial-preview").textContent = "Loading";
        document.body.classList.remove("overflow-hidden");
      }
    </script>

    <!-- VITE_EMBER_SSR_BODY -->

    <!--
      Dynamic imports, so that the browser paints the app shell above before it
      evaluates the app. With static imports it evaluates the whole module graph
      first when the scripts are already downloaded, and the shell never shows.

      This file is never prerendered (see index.ssg.html), so the app boots from nothing.
    -->
    <script type="module">
      const [{ default: Application }, { default: environment }] = await Promise.all([
        import("./app/app.ts"),
        import("./app/config/environment.ts"),
      ]);

      Application.create(environment.APP);
    </script>
  </body>
</html>
